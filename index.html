<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Journal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Instrument+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
</head>
<body>
<!-- LOGIN PAGE -->
<div id="page-login" class="page active">
  <div class="login-container">
    <div class="login-box">
      <h1>MyLife Journal</h1>
      <p class="login-subtitle">Write, reflect, grow</p>
      
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input 
            type="email" 
            id="login-email" 
            placeholder="your@email.com" 
            required
          />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input 
            type="password" 
            id="login-password" 
            placeholder="Enter your password" 
            required
          />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
      </form>
      
      <p class="login-footer">Don't have an account? <a href="#" onclick="showPage('signup')">Sign up</a></p>
    </div>
  </div>
</div>

<!-- SIGNUP PAGE -->
<div id="page-signup" class="page">
  <div class="login-container">
    <div class="login-box">
      <h1>Sign Up for MyLife Journal</h1>
      <p class="login-subtitle">Create your account</p>
      
      <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input 
            type="email" 
            id="signup-email" 
            placeholder="your@email.com" 
            required
          />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input 
            type="password" 
            id="signup-password" 
            placeholder="Create a password (min 6 chars)" 
            required
            minlength="6"
          />
        </div>
        <button type="submit" class="btn-primary" style="width: 100%;">Sign Up</button>
      </form>
      
      <p class="login-footer"><a href="#" onclick="showPage('login')">Already have an account? Login</a></p>
    </div>
  </div>
</div>

<!-- Weather Bar -->
<div id="weather-bar">
  <span id="weather-icon">⏳</span>
  <span id="weather-text">Fetching weather...</span>
  <button id="logout-btn" class="btn-ghost" style="margin-left: auto; display: none;" onclick="handleLogout()">Logout</button>
</div>

  <!-- WRITE PAGE -->
  <div id="page-write" class="page">
    <header>
      <div class="header-left">
        <h1>Journal</h1>
        <span id="today-label"></span>
      </div>
      <div style="display: flex; gap: 8px; align-items: center;">
        <span id="user-email" style="font-size: 12px; color: #a09f9b;"></span>
        <button class="btn-ghost" onclick="showPage('entries')">All entries →</button>
      </div>
    </header>

    <main>
      <div class="mood-row">
        <span class="label">How are you feeling?</span>
        <div class="moods">
          <button class="mood" data-mood="😊">😊</button>
          <button class="mood" data-mood="😌">😌</button>
          <button class="mood" data-mood="😔">😔</button>
          <button class="mood" data-mood="😤">😤</button>
          <button class="mood" data-mood="🤩">🤩</button>
        </div>
      </div>

      <div class="textarea-wrap">
        <textarea
          id="entry-text"
          placeholder="Write anything. No rules here."
          spellcheck="true"
        ></textarea>
        <div class="word-count"><span id="word-count">0</span> words</div>
      </div>

      <button class="btn-primary" onclick="saveEntry()">Save entry</button>
    </main>
  </div>

  <!-- ENTRIES PAGE -->
  <div id="page-entries" class="page">
    <header>
      <div class="header-left">
        <button class="btn-ghost" onclick="showPage('write')">← Write</button>
        <h2>All entries</h2>
      </div>
      <span id="entry-count" class="label"></span>
    </header>

    <main>
      <div id="entries-list"></div>
      <div id="empty-state" class="empty-state" style="display:none">
        <p>No entries yet.</p>
        <p>Start writing today.</p>
      </div>
    </main>
  </div>

  <!-- DETAIL PAGE -->
  <div id="page-detail" class="page">
    <header>
      <button class="btn-ghost" onclick="showPage('entries')">← Back</button>
      <div id="detail-meta"></div>
    </header>
    <main>
      <div id="detail-body" class="detail-body"></div>
      <button class="btn-danger" onclick="deleteCurrentEntry()">Delete entry</button>
    </main>
  </div>
<!-- Email Reminder Banner -->
<div class="reminder-banner">
  <span>📬 Daily 1:24pm journal reminder</span>
  <input type="email" id="reminder-email" placeholder="your@email.com" />
  <button onclick="subscribeEmail()">Notify me</button>
  <button type="button" id="notification-button" class="btn-secondary" onclick="enableNotifications()">Enable notifications</button>
</div>
  <!-- TOAST -->
  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
